<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="How bvm speeds up code while it runs">
  <title>How bvm speeds up code while it runs</title>
  <defs><marker id="a8D4A1F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8D4A1F"/></marker><marker id="aB9A898" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B9A898"/></marker></defs>
  <rect x="1" y="1" width="998" height="298" rx="16" fill="#FFFBF5" stroke="#F2DCC4" stroke-width="2"/>
  <text x="30" y="42" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">bvm compiles hot code to machine code while the program runs</text>
  <rect x="30" y="100" width="190" height="76" rx="8" fill="#F1EAE3" stroke="#B9A898" stroke-width="1.5"/>
  <text x="125.0" y="124.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">loaded</text>
  <text x="125.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">verified, prepared:</text>
  <text x="125.0" y="162.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">records, fused sequences</text>
  <rect x="270" y="100" width="190" height="76" rx="8" fill="#FFFFFF" stroke="#8D4A1F" stroke-width="1.5"/>
  <text x="365.0" y="124.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">interpreted</text>
  <text x="365.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">counts calls and</text>
  <text x="365.0" y="162.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">loop turns per function</text>
  <rect x="570" y="100" width="190" height="76" rx="8" fill="#FFE8D1" stroke="#FF7F11" stroke-width="1.5"/>
  <text x="665.0" y="124.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">compiled</text>
  <text x="665.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">machine code (x86-64,</text>
  <text x="665.0" y="162.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">arm64), values in registers</text>
  <rect x="810" y="100" width="160" height="76" rx="8" fill="#E1F3DC" stroke="#3E8E3E" stroke-width="1.5"/>
  <text x="890.0" y="124.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2B1A10" font-weight="bold" xml:space="preserve" style="white-space:pre">running loops</text>
  <text x="890.0" y="143.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">go on in compiled</text>
  <text x="890.0" y="162.0" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">code (OSR)</text>
  <polyline points="220,138 268,138" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <polyline points="460,138 568,138" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <polyline points="760,138 808,138" fill="none" stroke="#8D4A1F" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#a8D4A1F)"/>
  <text x="244" y="128" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">run</text>
  <text x="514" y="116" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">after 1000 calls</text>
  <text x="514" y="130" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">or loop turns</text>
  <polyline points="665,176 665,220 365,220 365,178" fill="none" stroke="#B9A898" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#aB9A898)"/>
  <text x="515" y="238" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">compiled and interpreted functions call each other</text>
  <text x="30" y="280" font-family="ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#7A5A44" font-weight="normal" xml:space="preserve" style="white-space:pre">BURN_JIT_THRESHOLD changes the threshold, BURN_JIT=0 turns compiling off.</text>
</svg>
